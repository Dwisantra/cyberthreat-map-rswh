[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-serve]
command=php artisan serve --host=0.0.0.0 --port=7000
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/laravel.err.log
stdout_logfile=/var/log/supervisor/laravel.out.log

[program:reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=7070
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/reverb.err.log
stdout_logfile=/var/log/supervisor/reverb.out.log

[program:syslog-daemon]
command=php artisan syslog:listen
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/syslog.err.log
stdout_logfile=/var/log/supervisor/syslog.out.log