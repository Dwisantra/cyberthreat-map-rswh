services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberthreat_app
    restart: always
    ports:
      - "7000:7000"
      - "7070:7070"
      - "514:514/udp"
    env_file:
      - .env
    volumes:
      - ./storage/app/geoip:/var/www/storage/app/geoip
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cyberthreat_db
    restart: always
    environment:
      MYSQL_DATABASE: cyberthreat_map
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: